# Publikacja builda (dist/) na GitHub Pages po każdym pushu do main oraz po nocnym snapshocie
# (wyzwalacz workflow_run). Commit snapshot-bota — choć wypychany kluczem wdrożeniowym — NIE
# wyzwala zdarzenia `push` (sprawdzone 26.09.2026: commit 61c7f1e nie uruchomił żadnego
# workflow i strona przez dwa dni serwowała stary snapshot). Po snapshocie publikacja rusza
# tylko wtedy, gdy bot faktycznie coś wypchnął (czubek main różni się od commitu, na którym
# eksport wystartował). Wymaga ustawienia: Settings → Pages → Source: "GitHub Actions".
#
# Publikowany jest DOKŁADNIE ten commit, który przeszedł kontrolę w tym samym przebiegu
# (job `check` → `build` → `deploy`): github.sha — dla push/dispatch commit zdarzenia, po
# snapshocie czubek main.
# Nieudane testy lub walidacja danych blokują publikację. Uprawnienia pages/id-token ma tylko
# job wdrożenia.

name: Publikacja na GitHub Pages

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ['Snapshot danych z bazy']
    types: [completed]
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check:
    # Po snapshocie tylko wtedy, gdy eksport się udał i bot coś wypchnął (github.sha to czubek
    # main, workflow_run.head_sha — commit, na którym eksport wystartował). Gdy nic się nie
    # zmieniło, cały przebieg jest pomijany i nie uruchamia E2E.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_sha != github.sha)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # push/dispatch: commit zdarzenia; workflow_run: czubek main (commit snapshot-bota).
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Ustal publikowany commit
        id: sha
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Publikowany commit: $(git rev-parse HEAD) — $(git log -1 --format=%s)"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Składnia, walidacja snapshotu i testy
        run: npm run check

  build:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.check.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
