# Nocny eksport tabel łowisk z bazy do pliku snapshotu w repozytorium.
# Odczyt korzysta z klucza publicznego z config.json (bez sekretów).
# Eksport wstrzymuje się, gdy baza zwraca mniej danych niż obecny snapshot
# (tools/snapshot/export.mjs), a walidacja odrzuca dane spoza limitów
# (tools/snapshot/validate.mjs) — wtedy nic nie jest commitowane, a job kończy się błędem.
#
# Commit jest wypychany kluczem wdrożeniowym (sekret SNAPSHOT_DEPLOY_KEY, klucz publiczny
# w Settings → Deploy keys z prawem zapisu), a nie tokenem Actions:
#  - gałąź main jest chroniona regułą; w liście obejść (bypass) jest „Deploy keys”,
#    więc bot może zapisać snapshot, a nikt inny nie ominie reguły;
#  - push kluczem NIE wyzwala zdarzenia `push` (tak samo jak push tokenem GITHUB_TOKEN;
#    potwierdzone 26.09.2026), dlatego stronę po snapshocie publikuje deploy.yml
#    wyzwalaczem workflow_run — tylko gdy bot faktycznie coś wypchnął.
# Bez sekretu SNAPSHOT_DEPLOY_KEY checkout używa tokenu Actions — tylko dlatego token ma
# contents: write; przy ustawionym kluczu wystarczy contents: read.

name: Snapshot danych z bazy

on:
  schedule:
    - cron: '15 3 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ssh-key: ${{ secrets.SNAPSHOT_DEPLOY_KEY }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      - name: Eksport z bazy
        run: npm run export

      - name: Walidacja snapshotu
        run: npm run validate

      - name: Commit, jeśli dane się zmieniły
        run: |
          FILE="public/$(jq -r .snapshot.file config.json)"
          if git diff --quiet -- "$FILE"; then
            echo "$FILE bez zmian — nic do commitowania."
            exit 0
          fi
          git config user.name  "snapshot-bot"
          git config user.email "snapshot-bot@users.noreply.github.com"
          git add -- "$FILE"
          git commit -m "Snapshot danych z bazy ($(date -u +%Y-%m-%d))"
          git push
